<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Yummy Pizza in Berlin">
    <meta name="author" content="Tobi Gritschacher">
    <title>Gimme yummy Pizza!</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header class="site-header">
        <div class="wrap">
            <h1>Gimme yummy Pizza!</h1>
        </div>
    </header>

    <main class="wrap">
        <form id="controls" class="controls">
            <label class="field">
                <span>Within</span>
                <select id="radius" name="radius">
                    <option value="2">2 km</option>
                    <option value="5" selected>5 km</option>
                    <option value="10">10 km</option>
                </select>
            </label>
            <button type="button" id="locate">Use my location</button>
            <button type="button" id="alexanderplatz">Alexanderplatz</button>
        </form>

        <p id="status" class="status" role="status">Retrieving all of the Pizza for you!</p>
        <noscript><p class="status">Awww.. Your browser does not tell me your location. I guess you have to find some yummy pizza without my help.</p></noscript>

        <section aria-labelledby="results-title">
            <h2 id="results-title" class="visually-hidden">Nearby pizza</h2>
            <ol id="results" class="results"></ol>
        </section>
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <p><a href="https://github.com/tobijat/yummypizza">GitHub</a> | Based on data by <a href="https://github.com/snaterlicious">snaterlicious</a></p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
